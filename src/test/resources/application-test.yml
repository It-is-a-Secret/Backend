# 테스트 전용 프로파일.
#
# @SpringBootTest(contextLoads)가 운영 인프라(MySQL·Redis·실제 SMTP/secrets) 없이도
# 전체 컨텍스트를 띄울 수 있도록 자급식 설정을 제공한다. CI test 잡은 DB·secrets를 주지
# 않으므로, 이 프로파일을 @ActiveProfiles("test")로 명시해 local 기본 프로파일을 우회한다.
#   - DB: H2 인메모리(MySQL 호환 모드) → Hibernate dialect 자동 판별 가능
#   - Redis: Lettuce 커넥션 팩토리는 기동 시 연결하지 않으므로 호스트만 지정
#   - Mail: spring.mail.host 지정 시 JavaMailSender 빈이 생성(기동 시 연결 안 함)
#   - JWT/Kakao/Cookie: 바인딩만 통과하면 되는 더미 값
spring:
  datasource:
    url: jdbc:h2:mem:blursome;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: localhost
    port: 25

app:
  jwt:
    secret: test-only-secret-key-that-is-at-least-32-bytes-long-for-hmac-sha256
    access-token-expires-in: 1800
    refresh-token-expires-in: 1209600
  oauth:
    kakao:
      client-id: test-client-id
      client-secret: test-client-secret
      redirect-uri: http://localhost/login/oauth/kakao
      authorize-uri: https://kauth.kakao.com/oauth/authorize
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
  cookie:
    secure: false
    same-site: Lax
  mail:
    from: no-reply@blursome.test
