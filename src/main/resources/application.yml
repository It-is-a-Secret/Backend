spring:
  application:
    name: blursome

  profiles:
    default: ${ACTIVE:local}

  jackson:
    time-zone: Asia/Seoul
    date-format: yyyy-MM-dd'T'HH:mm:ss

# 피드 이미지 스토리지(S3). 버킷·키가 아직 없어도 컨텍스트가 뜨도록 더미 placeholder를 기본값으로 둔다.
# 실제 값은 .env(S3_*)로 주입하며, 실제 S3 호출 검증은 #55 통합에서 수행한다.
app:
  s3:
    originals-bucket: ${S3_ORIGINALS_BUCKET:blursome-originals-dummy}
    variants-bucket: ${S3_VARIANTS_BUCKET:blursome-variants-dummy}
    variants-base-url: ${S3_VARIANTS_BASE_URL:https://blursome-variants-dummy.s3.ap-northeast-2.amazonaws.com/}
    region: ${S3_REGION:ap-northeast-2}
    put-expiration: ${S3_PUT_EXPIRATION:5m}
    get-expiration: ${S3_GET_EXPIRATION:5m}
    access-key: ${S3_ACCESS_KEY:dummy}
    secret-key: ${S3_SECRET_KEY:dummy}
  # PWA Web Push(VAPID, #121). 키가 비어 있으면 컨텍스트는 뜨고 푸시 발송만 건너뛴다(공개 키 API는 503).
  # 키 쌍은 한 번 만들어 고정한다(바꾸면 기존 구독이 모두 무효). 생성: npx web-push generate-vapid-keys
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    vapid-subject: ${VAPID_SUBJECT:mailto:admin@blursome.com}
    ttl: ${PUSH_TTL:1d}
    request-timeout: ${PUSH_REQUEST_TIMEOUT:5s}
    # 구독 endpoint로 허용할 푸시 서비스 호스트(정확히 같거나 하위 도메인). 서버가 임의 URL로 요청하지 않게 막는다.
    allowed-endpoint-hosts:
      - fcm.googleapis.com            # Chrome·Edge(Android 포함)
      - push.services.mozilla.com     # Firefox(updates.push.services.mozilla.com)
      - push.apple.com                # Safari·iOS 홈 화면 PWA(web.push.apple.com)
      - notify.windows.com            # 구형 Edge(WNS)

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
