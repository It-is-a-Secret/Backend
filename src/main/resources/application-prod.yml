spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      # ⚠️ 임시(테스트 배포 전용): DB 제약 변경이 많아 스키마를 1회 깨끗이 재생성하려고 create 사용.
      #    create는 기동할 때마다 전 테이블 drop 후 재생성 → 데이터가 매번 초기화된다.
      #    리셋 확인 후 반드시 update로 되돌릴 것. (원칙: docs/architecture/AWS_DEPLOYMENT.md §6.5)
      ddl-auto: create
    show-sql: false
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_ADDRESS}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expires-in: ${JWT_ACCESS_TOKEN_EXPIRES_IN:1800}
    refresh-token-expires-in: ${JWT_REFRESH_TOKEN_EXPIRES_IN:1209600}
  oauth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      client-secret: ${KAKAO_CLIENT_SECRET}
      redirect-uris: ${KAKAO_REDIRECT_URIS}
      authorize-uri: https://kauth.kakao.com/oauth/authorize
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
  cookie:
    secure: true
    same-site: None
  mail:
    from: ${GMAIL_ADDRESS}

server:
  tomcat:
    max-threads: 200
    accept-count: 100

logging:
  level:
    root: WARN
    com.blursome: INFO
