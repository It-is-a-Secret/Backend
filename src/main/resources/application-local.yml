spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 엔티티 변경을 DB에 바로 반영(기존 데이터 유지). 스키마를 초기화하려면 일시적으로 create-drop 사용.
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # 로컬에서도 실제 Gmail SMTP로 발송한다. 발송을 검증하려면 .env에 GMAIL_ADDRESS/GMAIL_APP_PASSWORD를
  # 채운다(미설정 시 빈 자격증명으로 빈만 생성되고, 발송 시도 시 인증 실패한다).
  # 발송 없이 로그로만 점검하려면 ACTIVE=local,maillog 처럼 maillog 프로파일을 함께 활성화한다.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_ADDRESS:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expires-in: ${JWT_ACCESS_TOKEN_EXPIRES_IN:1800}
    refresh-token-expires-in: ${JWT_REFRESH_TOKEN_EXPIRES_IN:1209600}
  oauth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      client-secret: ${KAKAO_CLIENT_SECRET}
      redirect-uris: ${KAKAO_REDIRECT_URIS}
      authorize-uri: https://kauth.kakao.com/oauth/authorize
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
  cookie:
    secure: false
    same-site: Lax
  mail:
    from: ${GMAIL_ADDRESS:no-reply@blursome.local}

logging:
  level:
    com.blursome: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
