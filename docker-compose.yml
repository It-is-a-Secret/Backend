# BlurSome 단일 EC2 배포용 Compose
# 설계: docs/architecture/AWS_DEPLOYMENT.md
#
# 사용법:
#   1) .env.example을 복사해 .env를 채운다 (ACTIVE=prod, DB_*, REDIS_*, JWT_*, KAKAO_* ...)
#   2) docker compose up -d --build
#   3) 배포 확인:  curl http://<호스트>/api/ping   ->  {"data":"pong", ...}
#
# 주의: MySQL/Redis는 127.0.0.1(루프백)에만 바인딩한다(외부 직접 접근 차단).
#       외부 노출은 Nginx(80/443)만 허용한다.

services:
  app:
    # CI(GitHub Actions)가 빌드해 GHCR에 올린 이미지를 사용한다.
    #   - 서버 배포:  docker compose pull && docker compose up -d   (이미지 pull)
    #   - 로컬 빌드:  docker compose up -d --build                  (아래 build로 직접 빌드 후 같은 태그로 태깅)
    image: ghcr.io/it-is-a-secret/blursome:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blursome-app
    env_file: .env
    environment:
      # JVM 힙 상한 (t4g.small 2GB 기준)
      JAVA_OPTS: "-Xms256m -Xmx512m"
    expose:
      - "8080"          # 내부 네트워크에만 노출, 외부 공개는 Nginx 경유
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: blursome-mysql
    command:
      - "--innodb-buffer-pool-size=128M"
      - "--skip-name-resolve"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    environment:
      MYSQL_DATABASE: blursome
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3306:3306"   # 호스트 디버깅용 (루프백 전용)
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: blursome-redis
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
      - "--maxmemory"
      - "96mb"
      - "--maxmemory-policy"
      - "noeviction"
      - "--appendonly"
      - "yes"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"   # 호스트 디버깅용 (루프백 전용)
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: blursome-nginx
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # TLS 적용 시 주석 해제 (certbot 인증서 마운트)
      # - ./certbot/conf:/etc/letsencrypt:ro
      # - ./certbot/www:/var/www/certbot:ro
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
