# BlurSome 리버스 프록시 설정
# 설계: docs/architecture/AWS_DEPLOYMENT.md §7 (WebSocket 프록시)
#
# 초기 배포 검증 단계에서는 HTTP(80)만으로 동작 확인이 가능하다.
# 도메인/인증서 발급 후 아래 "TLS 적용" 블록을 활성화한다.

upstream blursome_app {
    server app:8080;
}

server {
    listen 80;
    server_name _;

    # --- Let's Encrypt 갱신용 (TLS 적용 시 사용) ---
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- 채팅 WebSocket (STOMP 엔드포인트 경로에 맞춰 조정) ---
    location /ws {
        proxy_pass http://blursome_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # --- 일반 REST API ---
    location / {
        proxy_pass http://blursome_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

